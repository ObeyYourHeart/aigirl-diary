<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AI娘串门日记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  </head>
<body>
  <div id="root">
    <div class="screen" id="loading">正在准备行李……</div>
    <div class="screen" id="setup"></div>
    <div class="screen" id="game"></div>
    <div class="screen" id="end"></div>
    <div class="overlay" id="stage"></div>
    <div class="overlay" id="cutin"></div>
    <div class="overlay" id="fight"></div>
    <div class="overlay" id="rules"></div>
  </div>
  <script>
(async()=>{if(!('serviceWorker'in navigator)){document.getElementById('loading').textContent='这个浏览器不支持，请用 Chrome / Edge / Safari 最新版';return;}
const had=!!navigator.serviceWorker.controller;const reg=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
// 已经装过旧版本：先检查有没有新版本；新版本接管后自动刷新一次（旧版本按旧文件名取素材会取不到）
if(had){navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload(),{once:true});try{await reg.update();}catch{}if(reg.installing||reg.waiting)return;}
if(!navigator.serviceWorker.controller){await new Promise(r=>navigator.serviceWorker.addEventListener('controllerchange',r,{once:true}));}
const s=document.createElement('script');s.type='module';s.src='app.js?v=1791413287870';document.body.append(s);
setTimeout(()=>navigator.serviceWorker.controller?.postMessage('warm'),1500);})();
</script>
</body>
</html>
