<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI娘串门日记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  </head>
<body>
  <div id="root">
    <div class="screen" id="loading">正在准备行李……</div>
    <div class="screen" id="setup"></div>
    <div class="screen" id="game"></div>
    <div class="screen" id="end"></div>
    <div class="overlay" id="stage"></div>
    <div class="overlay" id="cutin"></div>
    <div class="overlay" id="fight"></div>
    <div class="overlay" id="rules"></div>
  </div>
  <script>
(async()=>{if(!('serviceWorker'in navigator)){document.getElementById('loading').textContent='这个浏览器不支持，请用 Chrome / Edge / Safari 最新版';return;}
await navigator.serviceWorker.register('sw.js');if(!navigator.serviceWorker.controller){await new Promise(r=>navigator.serviceWorker.addEventListener('controllerchange',r,{once:true}));}
const s=document.createElement('script');s.type='module';s.src='app.js?v=1791351837895';document.body.append(s);})();
</script>
</body>
</html>
